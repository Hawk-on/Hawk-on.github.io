# Kontroll av pull requests.
#
# deploy.yml køyrer berre på push til master, og endar med å publisere til Pages.
# Den kan difor ikkje brukast til å kontrollere ein PR. Utan denne fila ville
# Dependabot-PR-ar kome heilt utan sjekkar, og måtte merges blindt.
#
# Same stega som i deploy.yml, utan publiseringa.
name: Kontroller pull request

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# Ny push til same PR avbryt den førre køyringa.
concurrency:
  group: kontroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sjekk
      - run: npm run build
